name: Windows DXUP build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Install build tools
        run: python -m pip install 'meson>=1.4,<2' ninja
      - name: Configure (MSVC ${{ matrix.arch }})
        run: meson setup build-msvc-${{ matrix.arch }} --backend=ninja --buildtype=release
      - name: Compile DLLs
        run: meson compile -C build-msvc-${{ matrix.arch }}
      - name: Collect Windows DLLs
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $buildDir = "build-msvc-$arch"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          foreach ($dll in @('d3d9', 'd3d10_1', 'dxgi')) {
            $source = Join-Path $buildDir "src/$dll/$dll.dll"
            if (-not (Test-Path $source)) { throw "Missing build output: $source" }
            Copy-Item $source "artifacts/$dll.dll"
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'artifacts/d3d9.dll').Path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = if ($arch -eq 'x86') { 0x014c } else { 0x8664 }
          if ($machine -ne $expected) {
            throw ('Unexpected d3d9.dll machine type: 0x{0:X4} (expected 0x{1:X4})' -f $machine, $expected)
          }
      - name: Upload Windows DLLs
        uses: actions/upload-artifact@v4
        with:
          name: dxup-windows-${{ matrix.arch }}
          path: artifacts/*.dll
          if-no-files-found: error
